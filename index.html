<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Zundamon Companion</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent !important;
    }
    #canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: pointer;
      -webkit-app-region: no-drag;
    }
    #canvas:active {
      cursor: grabbing;
    }

    /* Subtitle - Clean Text Only with Soft Drop Shadow */
    #subtitle {
      position: absolute;
      bottom: 12px;
      left: 10px;
      right: 10px;
      background: transparent;
      color: #7CFC00;
      font-family: 'Pretendard', 'Malgun Gothic', 'Segoe UI', sans-serif;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
      padding: 4px 8px;
      border: none;
      text-align: center;
      word-break: keep-all;
      pointer-events: none;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      -webkit-text-stroke: 0;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.75), 0 1px 2px rgba(0, 0, 0, 0.6);
      z-index: 20;
    }
    #subtitle.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Clean Pure White Speech Bubble UI */
    #speech-bubble {
      position: absolute;
      top: 14px;
      left: 12px;
      right: 12px;
      max-width: calc(100% - 24px);
      margin: 0 auto;
      background: #FFFFFF;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 16px;
      padding: 9px 13px 10px 13px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.24), 0 1px 4px rgba(0, 0, 0, 0.1);
      color: #111827;
      font-family: 'Pretendard', 'Malgun Gothic', 'Segoe UI', sans-serif;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.88) translateY(-6px);
      transition: opacity 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                  transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 30;
    }
    #speech-bubble.show {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
    .bubble-text {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.45;
      word-break: keep-all;
      white-space: pre-wrap;
      color: #111827;
      text-align: center;
    }
    .bubble-arrow {
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 8px solid #FFFFFF;
      filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.12));
    }

    /* Toast Notification */
    #toast {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%) translateY(-6px);
      background: rgba(10, 26, 14, 0.92);
      color: #4ADE80;
      border: 1px solid rgba(74, 222, 128, 0.6);
      padding: 6px 14px;
      border-radius: 20px;
      font-family: 'Pretendard', 'Malgun Gothic', 'Segoe UI', sans-serif;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(0,0,0,0.6), 0 0 10px rgba(74, 222, 128, 0.35);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 35;
      white-space: nowrap;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
  <script src="/static/live2dcubismcore.min.js"></script>
  <script src="/static/pixi.min.js"></script>
  <script src="/static/cubism4.min.js"></script>
</head>
<body>
  <div id="toast"></div>
  <div id="speech-bubble" class="speech-bubble">
    <div id="bubble-text" class="bubble-text"></div>
    <div class="bubble-arrow"></div>
  </div>
  <canvas id="canvas"></canvas>
  <div id="subtitle"></div>

  <script>
    window.onerror = function(msg, url, line, col, err) {
      fetch('/api/model_error?err=' + encodeURIComponent(`JS error: ${msg} at line ${line}:${col}`)).catch(()=>{});
    };
    window.onunhandledrejection = function(e) {
      fetch('/api/model_error?err=' + encodeURIComponent(`Promise rejection: ${e.reason}`)).catch(()=>{});
    };

    const canvas = document.getElementById('canvas');
    const subtitleEl = document.getElementById('subtitle');
    const speechBubbleEl = document.getElementById('speech-bubble');
    const bubbleTextEl = document.getElementById('bubble-text');
    const toastEl = document.getElementById('toast');

    // Display & Subtitle Mode State: 'bubble' | 'bottom' | 'none'
    let displayMode = localStorage.getItem('zundamon_display_mode') || 'bubble';
    let isSubtitleEnabled = localStorage.getItem('zundamon_sub_enabled') !== '0';
    let currentSubtitleSize = parseInt(localStorage.getItem('zundamon_sub_size') || '14', 10);
    if (isNaN(currentSubtitleSize) || currentSubtitleSize < 10) currentSubtitleSize = 14;

    // Operation Modes
    let subtitleMode = localStorage.getItem('zundamon_sub_mode') !== '0';

    function applyDisplaySettings(saveServer = true) {
      if (subtitleEl) subtitleEl.style.fontSize = currentSubtitleSize + 'px';
      if (bubbleTextEl) bubbleTextEl.style.fontSize = Math.min(16, currentSubtitleSize) + 'px';

      if (displayMode === 'none' || !isSubtitleEnabled) {
        if (subtitleEl) subtitleEl.classList.remove('show');
        if (speechBubbleEl) speechBubbleEl.classList.remove('show');
      }

      localStorage.setItem('zundamon_display_mode', displayMode);
      localStorage.setItem('zundamon_sub_enabled', isSubtitleEnabled ? '1' : '0');
      localStorage.setItem('zundamon_sub_size', currentSubtitleSize.toString());

      if (saveServer) {
        fetch('/api/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            display_mode: displayMode,
            subtitle_enabled: isSubtitleEnabled,
            subtitle_size: currentSubtitleSize
          })
        }).catch(() => {});
      }
    }

    let subPreviewTimeout = null;
    function previewSubtitle() {
      if (!isSubtitleEnabled || displayMode === 'none') return;
      const previewMsg = `🌱 보쿠는 즌다몬인 것이다! (${currentSubtitleSize}px)`;

      if (displayMode === 'bubble' && speechBubbleEl && bubbleTextEl) {
        bubbleTextEl.textContent = previewMsg;
        speechBubbleEl.classList.add('show');
        if (subPreviewTimeout) clearTimeout(subPreviewTimeout);
        subPreviewTimeout = setTimeout(() => {
          if (!isSpeaking) speechBubbleEl.classList.remove('show');
        }, 2200);
      } else if (subtitleEl) {
        subtitleEl.textContent = previewMsg;
        subtitleEl.classList.add('show');
        if (subPreviewTimeout) clearTimeout(subPreviewTimeout);
        subPreviewTimeout = setTimeout(() => {
          if (!isSpeaking) subtitleEl.classList.remove('show');
        }, 2200);
      }
    }

    applyDisplaySettings(false);

    const app = new PIXI.Application({
      view: canvas,
      autoStart: true,
      backgroundAlpha: 0,
      transparent: true,
      resizeTo: window
    });

    let live2dModel = null;
    let audioCtx = null;
    let analyser = null;
    let dataArray = null;
    let isSpeaking = false;
    let activeAudio = null;

    // Expressions Map for Ctrl + 1 ~ 9
    const expressionsList = [
      { key: '1', id: 'exp_smile', name: '미소', icon: '😊' },
      { key: '2', id: 'exp_laugh', name: '활짝', icon: '😆' },
      { key: '3', id: 'exp_shy', name: '부끄', icon: '😳' },
      { key: '4', id: 'exp_surprise', name: '깜짝', icon: '😲' },
      { key: '5', id: 'exp_angry', name: '삐짐', icon: '😤' },
      { key: '6', id: 'exp_sad', name: '시무룩', icon: '🥺' },
      { key: '7', id: 'exp_sleep', name: '졸림', icon: '😴' },
      { key: '8', id: 'exp_01', name: '초롱', icon: '✨' },
      { key: '9', id: 'exp_laugh2', name: '신남', icon: '🥳' },
      { key: '0', id: 'exp_smile', name: '초기화', icon: '🌱' }
    ];

    let toastTimer = null;
    function showToast(msg) {
      if (!toastEl) return;
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastEl.classList.remove('show');
      }, 1600);
    }

    function applyExpression(exprObj) {
      if (!live2dModel) return;
      try {
        live2dModel.expression(exprObj.id);
      } catch(e) {}
    }

    // Zoom/scale level persisted in localStorage (snapped to 0.2 rate)
    let savedZoom = parseFloat(localStorage.getItem('zundamon_zoom') || '1.0');
    if (isNaN(savedZoom)) savedZoom = 1.0;
    let currentScaleMultiplier = Math.max(0.4, Math.min(3.0, Math.round((Math.round(savedZoom / 0.2) * 0.2) * 10) / 10));
    localStorage.setItem('zundamon_zoom', currentScaleMultiplier.toFixed(1));

    function broadcastScale() {
      bc.postMessage({ type: 'scale_updated', scale: currentScaleMultiplier });
    }

    let modelBaseWidth = 0;
    let modelBaseHeight = 0;

    function resizeModel() {
      if (!live2dModel) return;
      if (!modelBaseWidth || !modelBaseHeight) {
        modelBaseWidth = live2dModel.internalModel?.originalWidth || live2dModel.internalModel?.width || (live2dModel.width / (live2dModel.scale.x || 1)) || 1000;
        modelBaseHeight = live2dModel.internalModel?.originalHeight || live2dModel.internalModel?.height || (live2dModel.height / (live2dModel.scale.y || 1)) || 1000;
      }
      const w = window.innerWidth;
      const h = window.innerHeight;
      const baseScale = Math.min(w / modelBaseWidth, h / modelBaseHeight) * 1.35;
      const finalScale = baseScale * currentScaleMultiplier;
      live2dModel.scale.set(finalScale);
      live2dModel.anchor.set(0.5, 0.5);
      live2dModel.position.set(w / 2, h / 2 + 35 * currentScaleMultiplier);
    }

    function changeScale(delta = 0.2) {
      let raw = (Math.round(currentScaleMultiplier * 10) + Math.round(delta * 10)) / 10;
      let rounded = Math.round(raw / 0.2) * 0.2;
      currentScaleMultiplier = Math.max(0.4, Math.min(3.0, Math.round(rounded * 10) / 10));
      localStorage.setItem('zundamon_zoom', currentScaleMultiplier.toFixed(1));
      resizeModel();
      broadcastScale();
      showToast(`🔍 배율: ${currentScaleMultiplier.toFixed(1)}x`);
    }

    function resetScale() {
      currentScaleMultiplier = 1.0;
      localStorage.setItem('zundamon_zoom', '1.0');
      resizeModel();
      broadcastScale();
      showToast(`🔍 배율: 1.0x (초기화)`);
    }

    function resetExpression() {
      applyExpression(expressionsList[0]);
      showToast(`🎭 기본 표정으로 초기화`);
    }

    // Dynamic Window/Canvas Resizing
    function setCanvasDimensions(w, h) {
      w = Math.max(280, Math.min(1920, parseInt(w) || 560));
      h = Math.max(350, Math.min(1440, parseInt(h) || 750));

      if (window.pywebview && window.pywebview.api && window.pywebview.api.resize_window) {
        window.pywebview.api.resize_window(w, h);
      }
      fetch('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ win_w: w, win_h: h })
      }).catch(() => {});

      setTimeout(resizeModel, 80);
      showToast(`📐 캔버스: ${w} × ${h}px`);
    }

    // Toggle Separate Settings Window (Ctrl + ,)
    function toggleSettingsWindow() {
      if (window.pywebview && window.pywebview.api && window.pywebview.api.toggle_settings) {
        try {
          window.pywebview.api.toggle_settings();
          return;
        } catch(e) {}
      }
      fetch('/api/toggle_settings', { method: 'POST' }).catch(() => {
        fetch('/api/toggle_settings').catch(() => {});
      });
    }

    // Cross-Window Real-time Communication Channel
    const bc = new BroadcastChannel('zundamon_channel');
    bc.onmessage = (e) => {
      const data = e.data;
      if (!data) return;
      if (data.type === 'expression') {
        applyExpression(data.expr);
        showToast(`🎭 표정: ${data.expr.name}`);
      } else if (data.type === 'scale_delta') {
        changeScale(data.delta);
      } else if (data.type === 'scale_reset') {
        resetScale();
      } else if (data.type === 'expression_reset') {
        resetExpression();
      } else if (data.type === 'get_scale') {
        broadcastScale();
      } else if (data.type === 'canvas_size') {
        setCanvasDimensions(data.w, data.h);
      } else if (data.type === 'subtitle_toggle') {
        isSubtitleEnabled = !!data.enabled;
        applyDisplaySettings(false);
        showToast(isSubtitleEnabled ? '💬 자막: ON' : '💬 자막: OFF');
      } else if (data.type === 'display_mode') {
        displayMode = data.mode || 'bubble';
        applyDisplaySettings(false);
        showToast(displayMode === 'bubble' ? '💭 말풍선 모드' : (displayMode === 'bottom' ? '📝 하단 자막 모드' : '❌ 자막 숨김'));
        previewSubtitle();
      } else if (data.type === 'subtitle_size') {
        currentSubtitleSize = data.size;
        applyDisplaySettings(false);
        previewSubtitle();
      } else if (data.type === 'subtitle_mode_toggle') {
        subtitleMode = !!data.enabled;
        localStorage.setItem('zundamon_sub_mode', subtitleMode ? '1' : '0');
        showToast(subtitleMode ? '💬 자막 모드: ON' : '💬 자막 모드: OFF');
      }
    };

    // Load initial config from server
    fetch('/api/config')
      .then(r => r.json())
      .then(cfg => {
        if (typeof cfg.subtitle_enabled === 'boolean') {
          isSubtitleEnabled = cfg.subtitle_enabled;
        }
        if (typeof cfg.subtitle_mode === 'boolean') {
          subtitleMode = cfg.subtitle_mode;
          localStorage.setItem('zundamon_sub_mode', subtitleMode ? '1' : '0');
        }

        if (cfg.subtitle_size) {
          currentSubtitleSize = parseInt(cfg.subtitle_size, 10);
        }
        if (cfg.display_mode) {
          displayMode = cfg.display_mode;
        }
        applyDisplaySettings(false);
      })
      .catch(() => {});

    // Load Zundamon Model
    PIXI.live2d.Live2DModel.from('/model/zundamon.model3.json', { autoInteract: false })
      .then(model => {
        live2dModel = model;
        app.stage.addChild(model);

        modelBaseWidth = model.internalModel?.originalWidth || model.internalModel?.width || model.width || 1000;
        modelBaseHeight = model.internalModel?.originalHeight || model.internalModel?.height || model.height || 1000;

        resizeModel();
        window.addEventListener('resize', resizeModel);

        applyExpression(expressionsList[0]);
        console.log('Zundamon Live2D Model loaded successfully!');
        fetch('/api/model_loaded').catch(() => {});
      })
      .catch(err => {
        console.error('Failed to load Live2D model:', err);
        fetch('/api/model_error?err=' + encodeURIComponent(err.toString())).catch(() => {});
      });

    // Keyboard Shortcuts (Audited & IME-safe)
    window.addEventListener('keydown', (e) => {
      if (e.ctrlKey) {
        const key = (e.key || '').toLowerCase();
        const code = e.code || '';

        // 1. Expressions: Ctrl + 1 ~ 9 and Ctrl + 0
        const foundExpr = expressionsList.find(x => key === x.key || code === 'Digit' + x.key || code === 'Numpad' + x.key);
        if (foundExpr) {
          e.preventDefault();
          if (foundExpr.key === '0') {
            resetExpression();
          } else {
            applyExpression(foundExpr);
            showToast(`🎭 표정: ${foundExpr.name}`);
          }
          return;
        }

        // 2. Scale adjustment by 0.2 (Ctrl + +, Ctrl + -)
        if (code === 'Equal' || code === 'NumpadAdd' || key === '+' || key === '=') {
          e.preventDefault();
          changeScale(0.2);
          return;
        } else if (code === 'Minus' || code === 'NumpadSubtract' || key === '-' || key === '_') {
          e.preventDefault();
          changeScale(-0.2);
          return;
        }
        // 3. Canvas boundary adjustment by 50px (Ctrl + [, Ctrl + ])
        else if (code === 'BracketRight' || key === ']') {
          e.preventDefault();
          setCanvasDimensions(window.innerWidth + 50, window.innerHeight + 50);
          return;
        } else if (code === 'BracketLeft' || key === '[') {
          e.preventDefault();
          setCanvasDimensions(window.innerWidth - 50, window.innerHeight - 50);
          return;
        }
        // 4. Toggle Settings Window (Ctrl + ,)
        else if (code === 'Comma' || key === ',') {
          e.preventDefault();
          toggleSettingsWindow();
          return;
        }
        // 5. Subtitle Toggle (Ctrl + U)
        else if (code === 'KeyU' || key === 'u' || key === 'ㅕ') {
          e.preventDefault();
          isSubtitleEnabled = !isSubtitleEnabled;
          subtitleMode = isSubtitleEnabled;
          localStorage.setItem('zundamon_sub_mode', subtitleMode ? '1' : '0');
          applyDisplaySettings(true);
          fetch('/api/config', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ subtitle_enabled: isSubtitleEnabled, subtitle_mode: subtitleMode })
          }).catch(() => {});
          bc.postMessage({ type: 'subtitle_toggle', enabled: isSubtitleEnabled });
          if (isSubtitleEnabled) {
            showToast('💬 자막: ON');
            previewSubtitle();
          } else {
            showToast('💬 자막: OFF');
          }
          return;
        }
        // 7. Subtitle Display Mode Toggle (Ctrl + J: 말풍선 -> 하단 자막 -> 자막 숨김)
        else if (code === 'KeyJ' || key === 'j' || key === 'ㅓ') {
          e.preventDefault();
          if (displayMode === 'bubble') {
            displayMode = 'bottom';
          } else if (displayMode === 'bottom') {
            displayMode = 'none';
          } else {
            displayMode = 'bubble';
          }
          applyDisplaySettings(true);
          fetch('/api/config', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ display_mode: displayMode })
          }).catch(() => {});
          bc.postMessage({ type: 'display_mode', mode: displayMode });
          showToast(displayMode === 'bubble' ? '💭 말풍선 모드' : (displayMode === 'bottom' ? '📝 하단 자막 모드' : '❌ 자막 숨김'));
          if (displayMode !== 'none') {
            previewSubtitle();
          }
          return;
        }
      }
    });

    // Completely disable mouse wheel zoom
    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      e.stopPropagation();
    }, { passive: false });

    // Left click & Drag-to-move handling
    let leftDownX = 0, leftDownY = 0;
    let leftDownTime = 0;
    let isLeftDragging = false;
    let dragPrevX = 0, dragPrevY = 0;
    let lastClickTimestamp = 0;

    canvas.addEventListener('mousedown', (e) => {
      window.focus();
      if (e.button === 0) {
        leftDownX = e.screenX;
        leftDownY = e.screenY;
        dragPrevX = e.screenX;
        dragPrevY = e.screenY;
        leftDownTime = Date.now();
        isLeftDragging = false;
      }
    });

    // Right-click dragging
    let isRightDragging = false;
    let dragStartX = 0, dragStartY = 0;

    window.addEventListener('mousedown', (e) => {
      if (e.button === 2) {
        isRightDragging = true;
        dragStartX = e.screenX;
        dragStartY = e.screenY;
        document.body.style.cursor = 'move';
      }
    });

    // Real-time Smooth Gaze Tracking Coordinates
    let targetFocusX = 0;
    let targetFocusY = 0;
    let currentFocusX = 0;
    let currentFocusY = 0;
    let lastMouseMoveTime = Date.now();

    window.addEventListener('mousemove', (e) => {
      lastMouseMoveTime = Date.now();

      // Local Mouse gaze tracking relative to window center
      const w = window.innerWidth || 560;
      const h = window.innerHeight || 750;
      targetFocusX = Math.max(-1.0, Math.min(1.0, (e.clientX - w / 2) / (w / 2)));
      targetFocusY = Math.max(-1.0, Math.min(1.0, -(e.clientY - h / 2) / (h / 2)));

      // Window dragging
      if (e.buttons === 1) {
        const totalDist = Math.hypot(e.screenX - leftDownX, e.screenY - leftDownY);
        if (totalDist > 4) {
          isLeftDragging = true;
          document.body.style.cursor = 'move';
          const dx = e.screenX - dragPrevX;
          const dy = e.screenY - dragPrevY;
          dragPrevX = e.screenX;
          dragPrevY = e.screenY;
          if (window.pywebview && window.pywebview.api && window.pywebview.api.move_window) {
            window.pywebview.api.move_window(dx, dy);
          }
        }
      } else if (isRightDragging && window.pywebview && window.pywebview.api && window.pywebview.api.move_window) {
        const dx = e.screenX - dragStartX;
        const dy = e.screenY - dragStartY;
        dragStartX = e.screenX;
        dragStartY = e.screenY;
        window.pywebview.api.move_window(dx, dy);
      }
    });

    window.addEventListener('mouseup', (e) => {
      document.body.style.cursor = 'default';
      if (e.button === 0) {
        const totalDist = Math.hypot(e.screenX - leftDownX, e.screenY - leftDownY);
        const elapsed = Date.now() - leftDownTime;
        if (!isLeftDragging && totalDist <= 4 && elapsed < 350) {
          // Touch / click reaction disabled
        }
        isLeftDragging = false;
      }
      if (e.button === 2) {
        isRightDragging = false;
      }
    });

    window.addEventListener('contextmenu', (e) => {
      e.preventDefault();
    });

    // Global Mouse Tracking via pywebview when cursor leaves companion window
    let isTrackingActive = false;
    async function startGlobalMouseTracking() {
      if (isTrackingActive) return;
      isTrackingActive = true;

      while (true) {
        try {
          const now = Date.now();
          // If local mouse hasn't moved recently, check global desktop cursor
          if (now - lastMouseMoveTime > 80 && window.pywebview && window.pywebview.api && window.pywebview.api.get_tracking) {
            const data = await window.pywebview.api.get_tracking();
            if (data && typeof data.fx === 'number') {
              targetFocusX = data.fx;
              targetFocusY = data.fy;
            }
          }
          // If completely idle for > 4.5s, look naturally forward
          if (now - lastMouseMoveTime > 4500) {
            targetFocusX = targetFocusX * 0.95;
            targetFocusY = targetFocusY * 0.95;
          }
        } catch(e) {}
        await new Promise(resolve => setTimeout(resolve, 50));
      }
    }

    window.addEventListener('pywebviewready', () => {
      startGlobalMouseTracking();
    });
    setTimeout(startGlobalMouseTracking, 600);

    // Live2D Real-time Lip-Sync & Eye/Head Gaze Updates in Ticker
    app.ticker.add((delta) => {
      if (!live2dModel || !live2dModel.internalModel || !live2dModel.internalModel.coreModel) return;
      const core = live2dModel.internalModel.coreModel;

      // Smooth gaze tracking calculation
      currentFocusX += (targetFocusX - currentFocusX) * 0.14;
      currentFocusY += (targetFocusY - currentFocusY) * 0.14;

      const finalAngleZ = currentFocusX * -5;
      const finalAngleX = currentFocusX * 24;
      const finalAngleY = currentFocusY * 18;
      const finalBodyX = currentFocusX * 7;

      try {
        core.setParameterValueById('ParamEyeBallX', currentFocusX * 0.9);
        core.setParameterValueById('ParamEyeBallY', currentFocusY * 0.9);
        core.setParameterValueById('ParamAngleX', Math.max(-30, Math.min(30, finalAngleX)));
        core.setParameterValueById('ParamAngleY', Math.max(-30, Math.min(30, finalAngleY)));
        core.setParameterValueById('ParamAngleZ', Math.max(-30, Math.min(30, finalAngleZ)));
        core.setParameterValueById('ParamBodyAngleX', Math.max(-10, Math.min(10, finalBodyX)));
      } catch(e) {}

      // Lip-sync
      if (isSpeaking && analyser && dataArray) {
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        let count = 0;
        for (let i = 2; i < 40 && i < dataArray.length; i++) {
          sum += dataArray[i];
          count++;
        }
        const avg = count > 0 ? (sum / count) : 0;
        let mouthOpen = Math.min(1.0, (avg / 100) * 1.3);
        if (mouthOpen < 0.08) mouthOpen = 0;

        try {
          core.setParameterValueById('ParamMouthOpenY', mouthOpen);
        } catch(e) {}
      }
    });

    let bubbleHideTimeout = null;
    let emotionResetTimeout = null;

    // Speak Function: Plays audio buffer with lipsync, comic bubble & subtitle
    function speakAudio(audioUrl, text, expression, motion) {
      if (activeAudio) {
        activeAudio.pause();
        activeAudio = null;
      }

      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        dataArray = new Uint8Array(analyser.frequencyBinCount);
      }

      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const audio = new Audio(audioUrl);
      activeAudio = audio;

      const source = audioCtx.createMediaElementSource(audio);
      source.connect(analyser);
      analyser.connect(audioCtx.destination);

      if (bubbleHideTimeout) {
        clearTimeout(bubbleHideTimeout);
        bubbleHideTimeout = null;
      }

      // Display dialogue in Comic Speech Bubble or Bottom Subtitle
      if (text && isSubtitleEnabled && displayMode !== 'none') {
        if (displayMode === 'bubble' && speechBubbleEl && bubbleTextEl) {
          bubbleTextEl.textContent = text;
          speechBubbleEl.classList.add('show');
          if (subtitleEl) subtitleEl.classList.remove('show');
        } else if (displayMode === 'bottom' && subtitleEl) {
          subtitleEl.textContent = text;
          subtitleEl.classList.add('show');
          if (speechBubbleEl) speechBubbleEl.classList.remove('show');
        }
      }

      isSpeaking = true;

      if (emotionResetTimeout) {
        clearTimeout(emotionResetTimeout);
        emotionResetTimeout = null;
      }

      // Apply dynamic expression if provided
      if (expression && live2dModel) {
        const found = expressionsList.find(x => x.id === expression || x.key === expression);
        if (found) {
          applyExpression(found);
        } else {
          try { live2dModel.expression(expression); } catch(e) {}
        }
      }

      // Play motion if provided or pick friendly talk motion
      if (live2dModel) {
        try {
          if (motion) {
            live2dModel.motion('', motion);
          } else {
            const talkMotions = ['mtnFace_talk', 'mtnBody_point', 'mtnBody_wave', 'mtnBody_yes'];
            const tm = talkMotions[Math.floor(Math.random() * talkMotions.length)];
            live2dModel.motion('', tm);
          }
        } catch(e) {}
      }

      audio.onended = () => {
        isSpeaking = false;
        // Keep bubble/subtitle visible for an extra 1.2s before fading out
        bubbleHideTimeout = setTimeout(() => {
          if (!isSpeaking) {
            if (speechBubbleEl) speechBubbleEl.classList.remove('show');
            if (subtitleEl) subtitleEl.classList.remove('show');
          }
        }, 1200);

        if (live2dModel && live2dModel.internalModel && live2dModel.internalModel.coreModel) {
          try {
            live2dModel.internalModel.coreModel.setParameterValueById('ParamMouthOpenY', 0);
          } catch(e) {}
        }

        // Return to default resting smile expression after speech finishes
        emotionResetTimeout = setTimeout(() => {
          if (!isSpeaking && live2dModel) {
            try {
              live2dModel.expression('exp_smile');
            } catch(e) {}
          }
        }, 2200);
      };

      audio.play().catch(e => console.error('Audio play error:', e));
    }

    // Polling speech queue from local server
    let lastAudioId = 0;
    async function checkSpeechQueue() {
      try {
        const res = await fetch('/api/poll_speech?last=' + lastAudioId);
        if (res.ok) {
          const data = await res.json();
          if (data && data.audioId && data.audioId > lastAudioId) {
            lastAudioId = data.audioId;
            speakAudio(data.audioUrl, data.text, data.expression, data.motion, data.params, data.emotion);
          }
        }
      } catch(e) {}
      setTimeout(checkSpeechQueue, 70);
    }

    setTimeout(checkSpeechQueue, 250);
  </script>
</body>
