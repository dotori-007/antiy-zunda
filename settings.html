<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>즌다몬 컴패니언 설정</title>
  <style>
    :root {
      --vv-bg: #242626;
      --vv-bg-alt: #1E2020;
      --vv-surface: #2B2E2E;
      --vv-surface-high: #343838;
      --vv-border: rgba(255, 255, 255, 0.14);
      --vv-border-subtle: rgba(255, 255, 255, 0.08);
      --vv-control: #3D4242;
      --vv-control-hover: #4C5252;
      --vv-control-active: #5B6262;
      --vv-primary: #A5D4AD;
      --vv-primary-bright: #84CC16;
      --vv-primary-dark: #2F4F35;
      --vv-accent-orange: #EE7800;
      --vv-text: #FFFFFF;
      --vv-text-sub: rgba(255, 255, 255, 0.65);
      --vv-text-dim: rgba(255, 255, 255, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--vv-bg);
      color: var(--vv-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Noto Sans KR", "Meiryo", sans-serif;
      font-size: 12px;
      padding: 0;
      margin: 0;
      overflow-x: hidden;
      overflow-y: auto;
    }

    body::-webkit-scrollbar {
      width: 6px;
    }
    body::-webkit-scrollbar-track {
      background: var(--vv-bg);
    }
    body::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }
    body::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.35);
    }

    /* Container */
    .vv-container {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Style / Expression Pill Chips */
    .vv-panel {
      background: var(--vv-surface);
      border: 1px solid var(--vv-border);
      border-radius: 8px;
      overflow: hidden;
    }

    .vv-panel-header {
      background: rgba(0, 0, 0, 0.15);
      padding: 9px 14px;
      font-size: 12px;
      font-weight: 700;
      color: var(--vv-primary);
      border-bottom: 1px solid var(--vv-border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .vv-panel-body {
      padding: 12px 14px;
    }

    .vv-style-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 8px;
    }

    .vv-style-chip {
      background: var(--vv-control);
      border: 1px solid var(--vv-border);
      color: var(--vv-text);
      padding: 7px 6px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.12s ease;
    }

    .vv-style-chip:hover {
      background: var(--vv-control-hover);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .vv-style-chip.active {
      background: var(--vv-primary-dark);
      border-color: var(--vv-primary);
      color: #FFFFFF;
      font-weight: 700;
    }

    .vv-btn-subtle {
      background: transparent;
      border: 1px dashed var(--vv-border);
      color: var(--vv-text-sub);
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 11px;
      cursor: pointer;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.12s;
    }

    .vv-btn-subtle:hover {
      background: var(--vv-control);
      color: var(--vv-primary);
      border-color: var(--vv-primary);
    }

    /* Signature Parameter Inspector Rows */
    .vv-param-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .vv-param-row {
      display: grid;
      grid-template-columns: 88px 1fr 58px 28px;
      align-items: center;
      gap: 8px;
    }

    .vv-param-label {
      font-size: 11px;
      color: var(--vv-text-sub);
      font-weight: 500;
      white-space: nowrap;
    }

    .vv-slider-container {
      display: flex;
      align-items: center;
    }

    .vv-slider {
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: var(--vv-bg-alt);
      outline: none;
      cursor: pointer;
      accent-color: var(--vv-primary-bright);
    }

    .vv-param-val {
      background: var(--vv-bg-alt);
      border: 1px solid var(--vv-border);
      border-radius: 4px;
      padding: 3px 6px;
      font-size: 11px;
      color: #FFFFFF;
      text-align: right;
      font-family: monospace;
      font-weight: 600;
    }

    .vv-btn-reset {
      background: var(--vv-control);
      border: 1px solid var(--vv-border);
      color: var(--vv-text-sub);
      border-radius: 4px;
      width: 28px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.12s;
    }

    .vv-btn-reset:hover {
      background: var(--vv-control-hover);
      color: #FFFFFF;
    }

    /* Quick Preset Chips Row */
    .vv-preset-row {
      display: flex;
      gap: 5px;
      margin-top: 4px;
      padding-left: 96px;
    }

    .vv-mini-chip {
      background: var(--vv-control);
      border: 1px solid var(--vv-border-subtle);
      color: var(--vv-text-sub);
      font-size: 10px;
      padding: 3px 7px;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.12s;
    }

    .vv-mini-chip:hover {
      background: var(--vv-control-hover);
      color: #FFFFFF;
    }

    .vv-mini-chip.active {
      background: var(--vv-primary-dark);
      border-color: var(--vv-primary);
      color: #FFFFFF;
      font-weight: 700;
    }

    /* Toggle Switch */
    .vv-switch-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: var(--vv-bg-alt);
      border: 1px solid var(--vv-border-subtle);
      border-radius: 4px;
      margin-top: 4px;
    }

    .vv-switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 20px;
    }
    .vv-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .vv-switch-slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--vv-control);
      transition: 0.2s;
      border-radius: 20px;
      border: 1px solid var(--vv-border);
    }
    .vv-switch-slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 2px;
      bottom: 2px;
      background-color: white;
      transition: 0.2s;
      border-radius: 50%;
    }
    input:checked + .vv-switch-slider {
      background-color: var(--vv-primary-bright);
      border-color: var(--vv-primary-bright);
    }
    input:checked + .vv-switch-slider:before {
      transform: translateX(18px);
      background-color: #1A2E05;
    }

    /* Subtitle Live Preview */
    .vv-subtitle-preview {
      background: #0D1111;
      border: 1px dashed var(--vv-border);
      border-radius: 4px;
      padding: 10px;
      text-align: center;
      margin-top: 8px;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .vv-subtitle-text {
      color: #7CFC00;
      font-weight: 700;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.75), 0 1px 2px rgba(0, 0, 0, 0.6);
      transition: font-size 0.12s ease;
    }

    /* Script / Text Row (Editor Timeline Cell) */
    .vv-cell-container {
      background: var(--vv-surface);
      border: 1px solid var(--vv-border);
      border-radius: 8px;
      padding: 12px 14px;
    }

    .vv-script-box {
      display: flex;
      align-items: stretch;
      background: var(--vv-bg-alt);
      border: 1px solid var(--vv-border);
      border-radius: 6px;
      overflow: hidden;
      margin-top: 8px;
    }

    .vv-btn-play {
      background: var(--vv-primary-bright);
      color: #1A2E05;
      border: none;
      width: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      cursor: pointer;
      font-weight: 900;
      transition: filter 0.15s, background 0.15s;
    }

    .vv-btn-play:hover {
      filter: brightness(1.1);
    }

    .vv-btn-play:active {
      filter: brightness(0.95);
    }

    .vv-btn-play:disabled {
      background: var(--vv-control);
      color: var(--vv-text-dim);
      cursor: not-allowed;
    }

    .vv-cell-num {
      background: rgba(255, 255, 255, 0.04);
      color: var(--vv-text-dim);
      padding: 10px 8px;
      font-family: monospace;
      font-size: 11px;
      border-right: 1px solid var(--vv-border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .vv-input-script {
      flex: 1;
      background: transparent;
      border: none;
      padding: 10px 12px;
      color: #FFFFFF;
      font-size: 13px;
      outline: none;
      user-select: text;
      font-family: inherit;
    }

    .vv-input-script::placeholder {
      color: var(--vv-text-dim);
    }
  </style>
</head>
<body>

  <div class="vv-container">

    <!-- 1. Styles / Expressions (Pill Chips) -->
    <div class="vv-panel">
      <div class="vv-panel-header">
        <span>🎭 캐릭터 스타일 / 표정 제어</span>
        <span style="font-size:10px; color:var(--vv-text-dim);">단축키 Ctrl + 1 ~ 9</span>
      </div>
      <div class="vv-panel-body">
        <div class="vv-style-grid" id="style-grid"></div>
        <button class="vv-btn-subtle" id="btn-reset-expr">
          <span>↺</span>
          <span>기본 스타일로 초기화 (Ctrl + 0)</span>
        </button>
      </div>
    </div>

    <!-- 2. Parameter Inspector -->
    <div class="vv-panel">
      <div class="vv-panel-header">
        <span>🎛️ 디스플레이 & 모델 파라미터</span>
        <span style="font-size:10px; color:var(--vv-text-dim);">실시간 동기화 (Sync)</span>
      </div>
      <div class="vv-panel-body">
        <div class="vv-param-list">

          <!-- Scale (0.2 Step) -->
          <div>
            <div class="vv-param-row">
              <span class="vv-param-label">배율 (Scale)</span>
              <div class="vv-slider-container">
                <input type="range" id="slider-scale" class="vv-slider" min="0.4" max="3.0" step="0.2" value="1.0">
              </div>
              <div class="vv-param-val" id="val-scale">1.0x</div>
              <button class="vv-btn-reset" id="btn-reset-scale" title="1.0x 초기화">↺</button>
            </div>
            <div class="vv-preset-row">
              <button class="vv-mini-chip" id="btn-scale-step-down">-0.2 축소</button>
              <button class="vv-mini-chip" id="btn-scale-step-up">+0.2 확대</button>
              <span style="margin-left:auto; font-size:10px; color:var(--vv-text-dim);">단축키: Ctrl + / -</span>
            </div>
          </div>

          <!-- Canvas Width -->
          <div>
            <div class="vv-param-row">
              <span class="vv-param-label">너비 (Width)</span>
              <div class="vv-slider-container">
                <input type="range" id="slider-w" class="vv-slider" min="280" max="1920" step="10" value="560">
              </div>
              <div class="vv-param-val" id="val-w">560px</div>
              <button class="vv-btn-reset" id="btn-reset-w" title="기본 560px 초기화">↺</button>
            </div>
            <div class="vv-preset-row">
              <button class="vv-mini-chip chip-w" data-w="420">420px</button>
              <button class="vv-mini-chip chip-w active" data-w="560">560px</button>
              <button class="vv-mini-chip chip-w" data-w="700">700px</button>
              <button class="vv-mini-chip chip-w" data-w="850">850px</button>
            </div>
          </div>

          <!-- Canvas Height -->
          <div>
            <div class="vv-param-row">
              <span class="vv-param-label">높이 (Height)</span>
              <div class="vv-slider-container">
                <input type="range" id="slider-h" class="vv-slider" min="350" max="1440" step="10" value="750">
              </div>
              <div class="vv-param-val" id="val-h">750px</div>
              <button class="vv-btn-reset" id="btn-reset-h" title="기본 750px 초기화">↺</button>
            </div>
            <div class="vv-preset-row">
              <button class="vv-mini-chip chip-h" data-h="580">580px</button>
              <button class="vv-mini-chip chip-h active" data-h="750">750px</button>
              <button class="vv-mini-chip chip-h" data-h="900">900px</button>
              <button class="vv-mini-chip chip-h" data-h="1100">1100px</button>
            </div>
          </div>

          <!-- Subtitle & Bubble Mode -->
          <div>
            <div class="vv-param-row">
              <span class="vv-param-label">대사 표시 방식</span>
              <div class="vv-preset-row" style="padding-left:0; margin-top:0;">
                <button class="vv-mini-chip chip-mode active" data-mode="bubble">💭 만화 말풍선</button>
                <button class="vv-mini-chip chip-mode" data-mode="bottom">📝 하단 자막</button>
                <button class="vv-mini-chip chip-mode" data-mode="none">❌ 숨김</button>
              </div>
            </div>
          </div>

          <!-- Subtitle Size -->
          <div>
            <div class="vv-param-row">
              <span class="vv-param-label">글자 크기 (Font)</span>
              <div class="vv-slider-container">
                <input type="range" id="slider-sub" class="vv-slider" min="10" max="36" step="1" value="14">
              </div>
              <div class="vv-param-val" id="val-sub">14px</div>
              <button class="vv-btn-reset" id="btn-reset-sub" title="14px 초기화">↺</button>
            </div>
            <div class="vv-preset-row">
              <button class="vv-mini-chip chip-sub" data-size="12">12px</button>
              <button class="vv-mini-chip chip-sub active" data-size="14">14px</button>
              <button class="vv-mini-chip chip-sub" data-size="17">17px</button>
              <button class="vv-mini-chip chip-sub" data-size="20">20px</button>
            </div>
          </div>

          <!-- Subtitle Toggle Switch -->
          <div class="vv-switch-container">
            <span style="font-size:11px; color:var(--vv-text-sub);">실시간 텍스트 표시 (Ctrl + U)</span>
            <label class="vv-switch">
              <input type="checkbox" id="chk-subtitle" checked>
              <span class="vv-switch-slider"></span>
            </label>
          </div>

          <!-- Subtitle Live Preview Box -->
          <div class="vv-subtitle-preview">
            <div id="sub-preview" class="vv-subtitle-text" style="font-size: 14px;">
              안녕인 것이다! 즌다몬인 것이다!
            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- 2.5 PC Overload Alert Settings -->
    <div class="vv-panel">
      <div class="vv-panel-header">
        <span>⚡ PC 리소스 과부하 감지 경고</span>
        <span style="font-size:10px; color:var(--vv-text-dim);">시스템 보호 알림</span>
      </div>
      <div class="vv-panel-body">
        <div class="vv-switch-container">
          <span style="font-size:11px; color:var(--vv-text);">CPU/메모리 90% 이상 시 음성 경고</span>
          <label class="vv-switch">
            <input type="checkbox" id="chk-resource" checked>
            <span class="vv-switch-slider"></span>
          </label>
        </div>
      </div>
    </div>

    <!-- 3. Speech Test (Script Cell UI) -->
    <div class="vv-cell-container">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:12px; font-weight:700; color:var(--vv-primary);">💬 음성 합성 및 립싱크 테스트</span>
      </div>
      <div class="vv-script-box">
        <button class="vv-btn-play" id="btn-speak" title="발화하기">▶</button>
        <div class="vv-cell-num">1</div>
        <input type="text" id="inp-speech" class="vv-input-script" value="보쿠는 즌다몬인 것이다! 잘 부탁하는 것이다!" placeholder="테스트할 대사를 입력하세요...">
      </div>
    </div>

  </div>

  <script>
    const bc = new BroadcastChannel('zundamon_channel');

    // Official VOICEVOX style mapped expressions
    const expressionsList = [
      { key: '1', id: 'exp_smile', name: 'ノーマル', kr: '미소', icon: '😊' },
      { key: '2', id: 'exp_laugh', name: 'あまあま', kr: '활짝', icon: '😆' },
      { key: '3', id: 'exp_shy', name: '照れ', kr: '부끄', icon: '😳' },
      { key: '4', id: 'exp_surprise', name: '驚き', kr: '깜짝', icon: '😲' },
      { key: '5', id: 'exp_angry', name: 'ツンツン', kr: '삐짐', icon: '😤' },
      { key: '6', id: 'exp_sad', name: 'しょんぼり', kr: '시무룩', icon: '🥺' },
      { key: '7', id: 'exp_sleep', name: 'ささやき', kr: '졸림', icon: '😴' },
      { key: '8', id: 'exp_01', name: 'キラキラ', kr: '초롱', icon: '✨' },
      { key: '9', id: 'exp_laugh2', name: 'ウキウキ', kr: '신남', icon: '🥳' },
      { key: '0', id: 'exp_smile', name: 'ノーマル', kr: '초기화', icon: '🌱' }
    ];

    // Build Style Pills
    const styleGrid = document.getElementById('style-grid');
    expressionsList.slice(0, 9).forEach(expr => {
      const chip = document.createElement('button');
      chip.className = 'vv-style-chip';
      chip.innerHTML = `<span>${expr.icon}</span> <span>${expr.name}</span> <span style="font-size:9px; opacity:0.6;">(${expr.kr})</span>`;
      chip.title = `Ctrl + ${expr.key} : ${expr.kr}`;
      chip.addEventListener('click', () => {
        document.querySelectorAll('.vv-style-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        bc.postMessage({ type: 'expression', expr: expr });
      });
      styleGrid.appendChild(chip);
    });

    document.getElementById('btn-reset-expr').addEventListener('click', () => {
      document.querySelectorAll('.vv-style-chip').forEach(c => c.classList.remove('active'));
      bc.postMessage({ type: 'expression_reset' });
    });

    // 1. Scale Control (0.2 Step)
    const sliderScale = document.getElementById('slider-scale');
    const valScale = document.getElementById('val-scale');
    const btnResetScale = document.getElementById('btn-reset-scale');
    const btnScaleStepDown = document.getElementById('btn-scale-step-down');
    const btnScaleStepUp = document.getElementById('btn-scale-step-up');

    function applyScale(s, updateSlider = true) {
      s = Math.max(0.4, Math.min(3.0, Math.round((Math.round(s / 0.2) * 0.2) * 10) / 10));
      valScale.textContent = s.toFixed(1) + 'x';
      if (updateSlider) sliderScale.value = s;
      localStorage.setItem('zundamon_zoom', s.toFixed(1));
    }

    sliderScale.addEventListener('input', () => {
      const s = parseFloat(sliderScale.value);
      applyScale(s, false);
      bc.postMessage({ type: 'scale_delta', delta: s - parseFloat(valScale.textContent) });
    });

    btnScaleStepDown.addEventListener('click', () => {
      bc.postMessage({ type: 'scale_delta', delta: -0.2 });
    });

    btnScaleStepUp.addEventListener('click', () => {
      bc.postMessage({ type: 'scale_delta', delta: 0.2 });
    });

    btnResetScale.addEventListener('click', () => {
      bc.postMessage({ type: 'scale_reset' });
    });

    // 2. Canvas Dimensions (Width & Height)
    const sliderW = document.getElementById('slider-w');
    const valW = document.getElementById('val-w');
    const sliderH = document.getElementById('slider-h');
    const valH = document.getElementById('val-h');
    const btnResetW = document.getElementById('btn-reset-w');
    const btnResetH = document.getElementById('btn-reset-h');
    const chipsW = document.querySelectorAll('.chip-w');
    const chipsH = document.querySelectorAll('.chip-h');

    function applyDimensions(w, h) {
      w = parseInt(w) || 560;
      h = parseInt(h) || 750;
      sliderW.value = w;
      valW.textContent = w + 'px';
      sliderH.value = h;
      valH.textContent = h + 'px';

      chipsW.forEach(c => c.classList.toggle('active', parseInt(c.dataset.w) === w));
      chipsH.forEach(c => c.classList.toggle('active', parseInt(c.dataset.h) === h));

      fetch('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ win_w: w, win_h: h })
      });
      bc.postMessage({ type: 'canvas_size', w: w, h: h });
    }

    sliderW.addEventListener('input', () => {
      applyDimensions(sliderW.value, sliderH.value);
    });
    sliderH.addEventListener('input', () => {
      applyDimensions(sliderW.value, sliderH.value);
    });

    chipsW.forEach(c => {
      c.addEventListener('click', () => {
        applyDimensions(c.dataset.w, sliderH.value);
      });
    });
    chipsH.forEach(c => {
      c.addEventListener('click', () => {
        applyDimensions(sliderW.value, c.dataset.h);
      });
    });

    btnResetW.addEventListener('click', () => applyDimensions(560, sliderH.value));
    btnResetH.addEventListener('click', () => applyDimensions(sliderW.value, 750));

    // 3. Subtitle Controls
    const chkSubtitle = document.getElementById('chk-subtitle');
    const sliderSub = document.getElementById('slider-sub');
    const valSub = document.getElementById('val-sub');
    const subPreview = document.getElementById('sub-preview');
    const btnResetSub = document.getElementById('btn-reset-sub');
    const chipsSub = document.querySelectorAll('.chip-sub');

    function updateSubtitle(enabled, size) {
      chkSubtitle.checked = enabled;
      sliderSub.value = size;
      valSub.textContent = size + 'px';
      subPreview.style.fontSize = size + 'px';
      subPreview.style.display = enabled ? 'block' : 'none';

      chipsSub.forEach(c => c.classList.toggle('active', parseInt(c.dataset.size) === size));

      fetch('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ subtitle_enabled: enabled, subtitle_size: size })
      });
      bc.postMessage({ type: 'subtitle_toggle', enabled: enabled });
      bc.postMessage({ type: 'subtitle_size', size: size });
    }

    chkSubtitle.addEventListener('change', () => {
      updateSubtitle(chkSubtitle.checked, parseInt(sliderSub.value));
    });

    sliderSub.addEventListener('input', () => {
      updateSubtitle(chkSubtitle.checked, parseInt(sliderSub.value));
    });

    chipsSub.forEach(c => {
      c.addEventListener('click', () => {
        updateSubtitle(chkSubtitle.checked, parseInt(c.dataset.size));
      });
    });

    btnResetSub.addEventListener('click', () => {
      updateSubtitle(chkSubtitle.checked, 14);
    });

    // Display Mode & Assistant Toggles
    const chipsMode = document.querySelectorAll('.chip-mode');
    let currentDisplayMode = 'bubble';

    function setDisplayMode(mode, saveServer = true) {
      currentDisplayMode = mode;
      chipsMode.forEach(c => c.classList.toggle('active', c.dataset.mode === mode));
      bc.postMessage({ type: 'display_mode', mode: mode });
      if (saveServer) {
        fetch('/api/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ display_mode: mode })
        }).catch(() => {});
      }
    }

    chipsMode.forEach(c => {
      c.addEventListener('click', () => {
        setDisplayMode(c.dataset.mode, true);
      });
    });

    const chkResource = document.getElementById('chk-resource');
    if (chkResource) {
      chkResource.addEventListener('change', () => {
        fetch('/api/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ resource_alert: chkResource.checked })
        }).catch(() => {});
      });
    }

    // 4. Voice Speech Test
    const inpSpeech = document.getElementById('inp-speech');
    const btnSpeak = document.getElementById('btn-speak');

    btnSpeak.addEventListener('click', () => {
      const text = inpSpeech.value.trim();
      if (!text) return;
      btnSpeak.disabled = true;
      btnSpeak.textContent = '■';
      fetch('/api/speak', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text, speaker: 3 })
      })
      .then(r => r.json())
      .finally(() => {
        setTimeout(() => {
          btnSpeak.disabled = false;
          btnSpeak.textContent = '▶';
        }, 1200);
      });
    });

    // Listen for companion broadcast messages
    bc.onmessage = (e) => {
      const data = e.data;
      if (!data) return;
      if (data.type === 'scale_updated' && typeof data.scale === 'number') {
        applyScale(data.scale, true);
      }
    };
    bc.postMessage({ type: 'get_scale' });

    // Initial Config Sync
    fetch('/api/config')
      .then(r => r.json())
      .then(cfg => {
        const w = cfg.win_w || 560;
        const h = cfg.win_h || 750;
        sliderW.value = w;
        valW.textContent = w + 'px';
        sliderH.value = h;
        valH.textContent = h + 'px';
        chipsW.forEach(c => c.classList.toggle('active', parseInt(c.dataset.w) === w));
        chipsH.forEach(c => c.classList.toggle('active', parseInt(c.dataset.h) === h));

        const subEnabled = cfg.subtitle_enabled !== false;
        const subSize = cfg.subtitle_size || 14;
        updateSubtitle(subEnabled, subSize);

        if (cfg.display_mode) {
          setDisplayMode(cfg.display_mode, false);
        }

        if (typeof cfg.resource_alert === 'boolean' && chkResource) chkResource.checked = cfg.resource_alert;

        const initScale = parseFloat(localStorage.getItem('zundamon_zoom') || '1.0');
        applyScale(initScale, true);
      })
      .catch(() => {});
  </script>
</body>
</html>
