<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌱 즌다몬 환경설정</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #0F172A;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
      padding: 18px;
      font-size: 13px;
      overflow-y: auto;
    }

    body::-webkit-scrollbar {
      width: 6px;
    }
    body::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 14px;
      border-bottom: 1px solid #1E293B;
      margin-bottom: 16px;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 700;
      color: #4ADE80;
    }

    .header-badge {
      background: rgba(74, 222, 128, 0.15);
      color: #4ADE80;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }

    /* Cards */
    .card {
      background: #1E293B;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 700;
      color: #94A3B8;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-title-hint {
      font-size: 11px;
      color: #64748B;
      font-weight: normal;
    }

    /* Expressions Grid */
    .expr-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 8px;
    }

    .btn-expr {
      background: #0F172A;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 7px 4px;
      color: #E2E8F0;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s;
    }

    .btn-expr:hover {
      background: #1E3A8A;
      border-color: #60A5FA;
      color: #FFFFFF;
      transform: translateY(-1px);
    }

    .btn-expr:active {
      transform: translateY(0);
    }

    .btn-expr.active {
      background: rgba(74, 222, 128, 0.25);
      border-color: #4ADE80;
      color: #4ADE80;
      font-weight: bold;
    }

    .btn-reset-expr {
      width: 100%;
      background: #0F172A;
      border: 1px dashed #475569;
      border-radius: 6px;
      padding: 7px;
      color: #94A3B8;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-reset-expr:hover {
      border-color: #4ADE80;
      color: #4ADE80;
      background: rgba(74, 222, 128, 0.1);
    }

    /* Presets & Buttons */
    .btn-group {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }

    .btn-chip {
      flex: 1;
      background: #0F172A;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 7px 4px;
      color: #CBD5E1;
      font-size: 11px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }

    .btn-chip:hover {
      background: #334155;
      color: #FFFFFF;
    }

    .btn-chip.active {
      background: #15803D;
      border-color: #4ADE80;
      color: #FFFFFF;
      font-weight: bold;
    }

    /* Inputs */
    .input-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .input-box {
      flex: 1;
      background: #0F172A;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 7px 8px;
      color: #FFFFFF;
      font-size: 12px;
      text-align: center;
    }
    .input-box:focus {
      outline: none;
      border-color: #4ADE80;
    }

    .btn-action {
      background: #16A34A;
      color: #FFFFFF;
      border: none;
      border-radius: 6px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-action:hover {
      background: #22C55E;
    }

    /* Toggle switch */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider-toggle {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155;
      transition: .2s;
      border-radius: 24px;
    }

    .slider-toggle:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }

    input:checked + .slider-toggle {
      background-color: #22C55E;
    }

    input:checked + .slider-toggle:before {
      transform: translateX(20px);
    }

    /* Subtitle Slider & Preview */
    .range-slider {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #334155;
      outline: none;
      accent-color: #4ADE80;
      cursor: pointer;
      margin: 8px 0;
    }

    .subtitle-preview-box {
      background: #020617;
      border: 1px dashed #334155;
      border-radius: 6px;
      padding: 14px 10px;
      text-align: center;
      margin-top: 8px;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .subtitle-preview-text {
      color: #7CFC00;
      font-weight: 700;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.75), 0 1px 2px rgba(0, 0, 0, 0.6);
      transition: font-size 0.15s;
    }

    /* Voice Test */
    .voice-input-row {
      display: flex;
      gap: 6px;
    }

    .voice-input {
      flex: 1;
      background: #0F172A;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px 10px;
      color: #FFFFFF;
      font-size: 12px;
      user-select: text;
    }
    .voice-input:focus {
      outline: none;
      border-color: #4ADE80;
    }

    /* Status Bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #64748B;
      padding-top: 6px;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22C55E;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-title">
      <span>🌱</span>
      <span>즌다몬 환경설정</span>
    </div>
    <div class="header-badge">실시간 연동 중</div>
  </div>

  <!-- 1. Expressions Card -->
  <div class="card">
    <div class="card-title">
      <span>🎭 표정 제어</span>
      <span class="card-title-hint">단축키 Ctrl + 1 ~ 9</span>
    </div>
    <div class="expr-grid" id="expr-grid"></div>
    <button class="btn-reset-expr" id="btn-reset-expr">🌱 기본 표정 초기화 (Ctrl + 0)</button>
  </div>

  <!-- 2. Canvas Dimensions Card -->
  <div class="card">
    <div class="card-title">
      <span>📐 캔버스 창 크기</span>
      <span class="card-title-hint">단축키 Ctrl + [ / ]</span>
    </div>
    <div class="btn-group">
      <button class="btn-chip" data-w="420" data-h="580">컴팩트 (420×580)</button>
      <button class="btn-chip active" data-w="560" data-h="750">기본 (560×750)</button>
      <button class="btn-chip" data-w="700" data-h="900">와이드 (700×900)</button>
    </div>
    <div class="input-row">
      <input type="number" id="inp-w" class="input-box" value="560" min="280" max="1920" step="10" placeholder="너비">
      <span style="color:#64748B">×</span>
      <input type="number" id="inp-h" class="input-box" value="750" min="350" max="1440" step="10" placeholder="높이">
      <button class="btn-action" id="btn-apply-size">적용</button>
    </div>
  </div>

  <!-- 3. Model Scale Card -->
  <div class="card">
    <div class="card-title">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span>🔍 캐릭터 배율 조절</span>
        <span id="scale-val" style="font-size:11px; color:#4ADE80; font-weight:700">1.0x</span>
      </div>
      <span class="card-title-hint">단축키 Ctrl + + / - (0.2 단위)</span>
    </div>
    <div class="btn-group">
      <button class="btn-chip" id="btn-scale-down">➖ 축소 (-0.2)</button>
      <button class="btn-chip" id="btn-scale-reset">1.0x 초기화</button>
      <button class="btn-chip" id="btn-scale-up">➕ 확대 (+0.2)</button>
    </div>
  </div>

  <!-- 4. Subtitle Settings Card -->
  <div class="card">
    <div class="card-title">
      <span>💬 실시간 자막</span>
      <span class="card-title-hint">단축키 Ctrl + U</span>
    </div>
    <div class="toggle-row">
      <span style="font-size:12px; color:#E2E8F0">자막 화면 표시</span>
      <label class="switch">
        <input type="checkbox" id="chk-subtitle" checked>
        <span class="slider-toggle"></span>
      </label>
    </div>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:6px;">
      <span style="font-size:11px; color:#94A3B8">글자 크기</span>
      <span id="sub-size-val" style="font-size:11px; color:#4ADE80; font-weight:700">14px</span>
    </div>
    <input type="range" id="sub-size-slider" class="range-slider" min="10" max="36" value="14">
    <div class="btn-group" style="margin-bottom:0">
      <button class="btn-chip btn-sub-chip" data-size="12">12px</button>
      <button class="btn-chip btn-sub-chip active" data-size="14">14px</button>
      <button class="btn-chip btn-sub-chip" data-size="17">17px</button>
      <button class="btn-chip btn-sub-chip" data-size="20">20px</button>
    </div>
    <div class="subtitle-preview-box">
      <div id="sub-preview" class="subtitle-preview-text" style="font-size: 14px;">
        안녕인 것이다! 즌다몬인 것이다!
      </div>
    </div>
  </div>

  <!-- 5. Voice Speech Test Card -->
  <div class="card">
    <div class="card-title">
      <span>🗣️ 음성 발화 테스트</span>
      <span class="card-title-hint">VOICEVOX 립싱크</span>
    </div>
    <div class="voice-input-row">
      <input type="text" id="inp-speech" class="voice-input" value="보쿠는 즌다몬인 것이다! 잘 부탁하는 것이다!" placeholder="테스트할 대사를 입력하세요">
      <button class="btn-action" id="btn-speak">말하기 🎙️</button>
    </div>
  </div>

  <!-- Status Bar -->
  <div class="status-bar">
    <div class="status-item">
      <div class="status-dot"></div>
      <span id="status-model">Live2D 정상</span>
    </div>
    <div class="status-item">
      <div class="status-dot"></div>
      <span id="status-vv">VOICEVOX 연동</span>
    </div>
    <div class="status-item">
      <span>Port: 8989</span>
    </div>
  </div>

  <script>
    const bc = new BroadcastChannel('zundamon_channel');

    const expressionsList = [
      { key: '1', id: 'exp_smile', name: '미소', icon: '😊' },
      { key: '2', id: 'exp_laugh', name: '활짝', icon: '😆' },
      { key: '3', id: 'exp_shy', name: '부끄', icon: '😳' },
      { key: '4', id: 'exp_surprise', name: '깜짝', icon: '😲' },
      { key: '5', id: 'exp_angry', name: '삐짐', icon: '😤' },
      { key: '6', id: 'exp_sad', name: '시무룩', icon: '🥺' },
      { key: '7', id: 'exp_sleep', name: '졸림', icon: '😴' },
      { key: '8', id: 'exp_01', name: '초롱', icon: '✨' },
      { key: '9', id: 'exp_laugh2', name: '신남', icon: '🥳' },
      { key: '0', id: 'exp_smile', name: '초기화', icon: '🌱' }
    ];

    // Build Expression Buttons
    const exprGrid = document.getElementById('expr-grid');
    expressionsList.slice(0, 9).forEach(expr => {
      const btn = document.createElement('button');
      btn.className = 'btn-expr';
      btn.innerHTML = `<span>${expr.icon}</span> <span>${expr.name}</span> <span style="font-size:10px; color:#64748B">(${expr.key})</span>`;
      btn.addEventListener('click', () => {
        document.querySelectorAll('.btn-expr').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        bc.postMessage({ type: 'expression', expr: expr });
      });
      exprGrid.appendChild(btn);
    });

    document.getElementById('btn-reset-expr').addEventListener('click', () => {
      document.querySelectorAll('.btn-expr').forEach(b => b.classList.remove('active'));
      bc.postMessage({ type: 'expression_reset' });
    });

    // Canvas Size Controls
    const inpW = document.getElementById('inp-w');
    const inpH = document.getElementById('inp-h');
    const btnApplySize = document.getElementById('btn-apply-size');
    const sizeChips = document.querySelectorAll('[data-w]');

    function applyCanvasDimensions(w, h) {
      w = parseInt(w) || 560;
      h = parseInt(h) || 750;
      inpW.value = w;
      inpH.value = h;
      fetch('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ win_w: w, win_h: h })
      });
      bc.postMessage({ type: 'canvas_size', w: w, h: h });
    }

    sizeChips.forEach(chip => {
      chip.addEventListener('click', () => {
        sizeChips.forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        applyCanvasDimensions(chip.getAttribute('data-w'), chip.getAttribute('data-h'));
      });
    });

    btnApplySize.addEventListener('click', () => {
      applyCanvasDimensions(inpW.value, inpH.value);
    });

    // Model Scale Controls (0.2 step)
    const scaleVal = document.getElementById('scale-val');
    function updateScaleDisplay(s) {
      if (scaleVal && typeof s === 'number') {
        scaleVal.textContent = s.toFixed(1) + 'x';
      }
    }

    let initScale = parseFloat(localStorage.getItem('zundamon_zoom') || '1.0');
    if (!isNaN(initScale)) {
      initScale = Math.round((Math.round(initScale / 0.2) * 0.2) * 10) / 10;
      updateScaleDisplay(initScale);
    }

    document.getElementById('btn-scale-down').addEventListener('click', () => {
      bc.postMessage({ type: 'scale_delta', delta: -0.2 });
    });
    document.getElementById('btn-scale-up').addEventListener('click', () => {
      bc.postMessage({ type: 'scale_delta', delta: 0.2 });
    });
    document.getElementById('btn-scale-reset').addEventListener('click', () => {
      bc.postMessage({ type: 'scale_reset' });
    });

    // Listen for companion broadcast messages (scale updates)
    bc.onmessage = (e) => {
      const data = e.data;
      if (!data) return;
      if (data.type === 'scale_updated' && typeof data.scale === 'number') {
        updateScaleDisplay(data.scale);
      }
    };
    bc.postMessage({ type: 'get_scale' });

    // Subtitle Controls
    const chkSubtitle = document.getElementById('chk-subtitle');
    const subSizeSlider = document.getElementById('sub-size-slider');
    const subSizeVal = document.getElementById('sub-size-val');
    const subPreview = document.getElementById('sub-preview');
    const subChips = document.querySelectorAll('.btn-sub-chip');

    function updateSubtitle(enabled, size) {
      chkSubtitle.checked = enabled;
      subSizeSlider.value = size;
      subSizeVal.textContent = size + 'px';
      subPreview.style.fontSize = size + 'px';
      subPreview.style.display = enabled ? 'block' : 'none';

      subChips.forEach(chip => {
        if (parseInt(chip.getAttribute('data-size')) === size) {
          chip.classList.add('active');
        } else {
          chip.classList.remove('active');
        }
      });

      fetch('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ subtitle_enabled: enabled, subtitle_size: size })
      });
      bc.postMessage({ type: 'subtitle_toggle', enabled: enabled });
      bc.postMessage({ type: 'subtitle_size', size: size });
    }

    chkSubtitle.addEventListener('change', () => {
      updateSubtitle(chkSubtitle.checked, parseInt(subSizeSlider.value));
    });

    subSizeSlider.addEventListener('input', () => {
      updateSubtitle(chkSubtitle.checked, parseInt(subSizeSlider.value));
    });

    subChips.forEach(chip => {
      chip.addEventListener('click', () => {
        updateSubtitle(chkSubtitle.checked, parseInt(chip.getAttribute('data-size')));
      });
    });

    // Voice Test
    const inpSpeech = document.getElementById('inp-speech');
    const btnSpeak = document.getElementById('btn-speak');

    btnSpeak.addEventListener('click', () => {
      const text = inpSpeech.value.trim();
      if (!text) return;
      btnSpeak.disabled = true;
      btnSpeak.textContent = '합성 중...';
      fetch('/api/speak', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text, speaker: 3 })
      })
      .then(r => r.json())
      .finally(() => {
        setTimeout(() => {
          btnSpeak.disabled = false;
          btnSpeak.textContent = '말하기 🎙️';
        }, 1000);
      });
    });

    // Fetch initial config from server
    fetch('/api/config')
      .then(r => r.json())
      .then(cfg => {
        if (cfg.win_w) inpW.value = cfg.win_w;
        if (cfg.win_h) inpH.value = cfg.win_h;
        const subEnabled = cfg.subtitle_enabled !== false;
        const subSize = cfg.subtitle_size || 14;
        updateSubtitle(subEnabled, subSize);
      })
      .catch(() => {});

    // Fetch health status
    fetch('/api/health')
      .then(r => r.json())
      .then(data => {
        if (data.voicevox) {
          document.getElementById('status-vv').textContent = 'VOICEVOX 연동';
        } else {
          document.getElementById('status-vv').textContent = 'VOICEVOX 대기';
        }
      })
      .catch(() => {});
  </script>
</body>
</html>
